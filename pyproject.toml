[tool.poetry]
name = "forecastit"
version = "0.1.0"
description = "Intelligent demand & sales forecasting system with cleaning pipelines, feature engineering, multiple model families, time-series CV & backtesting, explainability, uncertainty, API, dashboard, CI, Docker, and docs."
authors = ["ForecastIt Team <team@forecastit.ai>"]
readme = "README.md"
packages = [{include = "forecastit"}]

[tool.poetry.dependencies]
python = "^3.11"
numpy = "^1.24.0"
pandas = "^2.0.0"
polars = "^0.19.0"
scikit-learn = "^1.3.0"
lightgbm = "^4.0.0"
xgboost = "^1.7.0"
statsmodels = "^0.14.0"
prophet = {version = "^1.1.0", extras = ["cmdstanpy"]}
shap = "^0.42.0"
optuna = "^3.3.0"
mlflow = "^2.5.0"
prefect = "^2.14.0"
pydantic = "^2.0.0"
pydantic-settings = "^2.0.0"
structlog = "^23.1.0"
rich = "^13.4.0"
fastapi = "^0.103.0"
uvicorn = {extras = ["standard"], version = "^0.23.0"}
streamlit = "^1.25.0"
plotly = "^5.15.0"
python-dotenv = "^1.0.0"
orjson = "^3.9.0"
httpx = "^0.24.0"
cmdstanpy = "^1.1.0"
holidays = "^0.31.0"
scipy = "^1.11.0"
joblib = "^1.3.0"

[tool.poetry.group.dev.dependencies]
ruff = "^0.0.287"
black = "^23.7.0"
isort = "^5.12.0"
mypy = "^1.5.0"
pytest = "^7.4.0"
pytest-cov = "^4.1.0"
pytest-asyncio = "^0.21.0"
pre-commit = "^3.3.0"
types-requests = "^2.31.0"
types-python-dateutil = "^2.8.0"

[tool.poetry.extras]
dl = ["torch", "torchvision"]
dev = ["jupyter", "ipykernel", "matplotlib", "seaborn"]

# Ruff configuration
[tool.ruff]
target-version = "py311"
line-length = 100
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4", # flake8-comprehensions
    "UP", # pyupgrade
    "ARG001", # unused-function-args
    "SIM", # flake8-simplify
    "TCH", # flake8-type-checking
    "TID", # flake8-tidy-imports
    "Q",  # flake8-quotes
    "RUF", # ruff-specific rules
]
ignore = [
    "E501",  # line too long, handled by black
    "B008",  # do not perform function calls in argument defaults
    "C901",  # too complex
    "W191",  # indentation contains tabs
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*" = ["ARG001", "S101"]

[tool.ruff.isort]
known-first-party = ["forecastit"]

# Black configuration
[tool.black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
extend-exclude = '''
/(
  # directories
  \.eggs
  | \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | build
  | dist
)/
'''

# isort configuration
[tool.isort]
profile = "black"
line_length = 100
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true
known_first_party = ["forecastit"]

# pytest configuration
[tool.pytest.ini_options]
minversion = "7.0"
addopts = "-ra -q --strict-markers --strict-config"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = [
    "slow: marks tests as slow (deselect with '-m \"not slow\"')",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
]

# Coverage configuration
[tool.coverage.run]
source = ["forecastit"]
branch = true
parallel = true

[tool.coverage.report]
show_missing = true
skip_empty = true
fail_under = 85
omit = [
  "forecastit/forecastit/**/__init__.py",
  "forecastit/quick_demo.py",
  "forecastit/notebooks/*",
  "forecastit/scripts/*",
  "forecastit/reports/*",
  "forecastit/data/*",            # raw/interim/features files
  "forecastit/forecastit/viz/*",  # plotting helpers (optional)
  "forecastit/forecastit/**/__pycache__/*",
  "forecastit/forecastit/**/__main__.py",
  "forecastit/forecastit/**/cli.py",
  "forecastit/forecastit/tests/*",
  "forecastit/tests/*"
]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "if self.debug:",
    "if settings.DEBUG",
    "raise AssertionError",
    "raise NotImplementedError",
    "if 0:",
    "if __name__ == .__main__.:",
    "class .*\\bProtocol\\):",
    "@(abc\\.)?abstractmethod",
]

[tool.coverage.html]
directory = "htmlcov"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
